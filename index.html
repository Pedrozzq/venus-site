    <title>Distribuidora Venus</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --magenta: #B40064;
            --gold: #C5A059;
            --purple: #3D1E5E;
            --dark-bg: #050505;
            --white: #ffffff;
            
            /* Cores de Hover Marketplace */
            --ml-main: #FFE600;
            --ml-dark: #2D3277;
            --shopee-main: #EE4D2D;
            --tiktok-cyan: #25F4EE;
            --tiktok-pink: #FE2C55;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--white);
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            text-align: center;
            pointer-events: none;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -60px;
        }

        /* Estilo para recortar o texto da imagem e manter apenas o desenho */
        .logo-symbol {
            width: 130px;
            height: 110px; /* Altura reduzida para cortar o texto inferior */
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(30px);
            filter: drop-shadow(0 0 25px rgba(180, 0, 100, 0.35));
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha ao topo para pegar o ícone */
            overflow: hidden; /* Faz o recorte */
        }

        .logo-symbol img {
            width: 135%; /* Amplia para focar no ícone e remover as bordas com texto */
            height: auto;
            object-fit: contain;
            margin-top: -5px; /* Ajuste fino para centralizar o desenho no corte */
        }

        .logo-venus {
            font-size: clamp(2.8rem, 10vw, 5rem);
            letter-spacing: 20px;
            text-transform: uppercase;
            font-weight: 200;
            margin: 0;
            background: linear-gradient(to right, var(--magenta), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(20px);
        }

        .tagline {
            font-size: clamp(0.65rem, 1.4vw, 0.85rem);
            letter-spacing: 7px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transform: translateY(15px);
            font-weight: 300;
            margin-top: 15px;
        }

        .nav-footer {
            position: absolute;
            bottom: 45px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 20;
            pointer-events: auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .btn-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        @media (min-width: 900px) {
            .btn-row {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px 20px;
            }
        }

        .trust-info {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: translateY(15px);
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trust-stars {
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        .trust-sep {
            opacity: 0.35;
        }

        .trust-highlight {
            background: linear-gradient(to right, var(--magenta), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .btn-market {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            padding: 14px 18px;
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            opacity: 0;
            transform: translateY(20px);
            width: 300px;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            border: 1px solid transparent;
        }

        .btn-market svg {
            width: 22px;
            height: 22px;
            transition: transform 0.4s ease;
        }

        .btn-market svg:not(.logo-full) {
            fill: currentColor;
        }

        .btn-ml {
            background: rgba(255, 230, 0, 0.08);
            border-color: rgba(255, 230, 0, 0.2);
            color: rgba(255, 230, 0, 0.9);
        }

        .btn-ml:hover, .btn-ml:active {
            background: var(--ml-main);
            border-color: var(--ml-main);
            color: var(--ml-dark);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(255, 230, 0, 0.35);
        }

        .btn-shopee {
            background: rgba(238, 77, 45, 0.08);
            border-color: rgba(238, 77, 45, 0.2);
            color: rgba(238, 77, 45, 0.9);
        }

        .btn-shopee:hover, .btn-shopee:active {
            background: var(--shopee-main);
            border-color: var(--shopee-main);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(238, 77, 45, 0.35);
        }

        .btn-tiktok {
            position: relative;
            background: #ffffff;
            border-color: #ffffff;
            color: #050505;
            overflow: visible;
        }

        .btn-tiktok:hover, .btn-tiktok:active {
            background: #ffffff;
            border-color: #ffffff;
            color: #050505;
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(254, 44, 85, 0.3), 0 15px 40px rgba(37, 244, 238, 0.2);
        }

        .badge-new {
            position: absolute;
            top: -7px;
            right: 10px;
            font-size: 0.45rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(to right, var(--magenta), var(--gold));
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            line-height: 1.4;
        }

        @media (max-width: 600px), (max-height: 700px) {
            .logo-container {
                margin-top: -90px;
            }

            .logo-symbol {
                width: 95px;
                height: 80px;
                margin-bottom: 12px;
            }

            .tagline {
                margin-top: 8px;
            }

            .nav-footer {
                bottom: 30px;
                gap: 14px;
            }

            .btn-row {
                gap: 12px;
            }

            .btn-market {
                width: 280px;
                padding: 13px 18px;
                font-size: 0.64rem;
                letter-spacing: 1.2px;
                gap: 9px;
            }

            .btn-market svg {
                width: 20px;
                height: 20px;
            }

            .trust-info {
                font-size: 0.55rem;
                gap: 6px 10px;
            }

            .badge-new {
                font-size: 0.4rem;
                padding: 2px 6px;
                top: -6px;
                right: 8px;
            }
        }

        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>

            </svg>
            Comprar no TikTok Shop
        </a>
      </div>

      <div class="trust-info">
        <div class="trust-item">
            <span class="trust-stars">★★★★★</span>
            <span>4.9 avaliação</span>
        </div>
        <span class="trust-sep">•</span>
        <div class="trust-item"><span class="trust-highlight">+10 mil vendas em marketplace</span></div>
      </div>
    </footer>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        function createStars(count, size, opacity) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for(let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                const isGold = Math.random() > 0.75;
                if(isGold) {
                    colors[i * 3] = 0.77; 
                    colors[i * 3 + 1] = 0.62;
                    colors[i * 3 + 2] = 0.35;
                } else {
                    colors[i * 3] = 0.70; 
                    colors[i * 3 + 1] = 0.00;
                    colors[i * 3 + 2] = 0.39;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: size,
                vertexColors: true,
                transparent: true,
                opacity: opacity,
                blending: THREE.AdditiveBlending
            });

            return new THREE.Points(geometry, material);
        }

        const stars1 = createStars(10000, 0.008, 0.2);
        scene.add(stars1);
        const stars2 = createStars(3000, 0.015, 0.3);
        scene.add(stars2);
        const stars3 = createStars(500, 0.03, 0.4);
        scene.add(stars3);

        camera.position.z = 5;
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5);
            mouseY = (e.clientY / window.innerHeight - 0.5);
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX / window.innerWidth - 0.5);
                mouseY = (e.touches[0].clientY / window.innerHeight - 0.5);
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            stars1.rotation.y += 0.0003;
            stars1.position.x = targetX * 0.5;
            stars1.position.y = -targetY * 0.5;

            stars2.rotation.y += 0.0005;
            stars2.position.x = targetX * 1.2;
            stars2.position.y = -targetY * 1.2;

            stars3.rotation.y += 0.0008;
            stars3.position.x = targetX * 2.5;
            stars3.position.y = -targetY * 2.5;

            renderer.render(scene, camera);
        }

        window.onload = () => {
            const tl = gsap.timeline();
            gsap.to("#loader", { duration: 1.2, opacity: 0, delay: 0.8, onComplete: () => {
                document.getElementById('loader').style.display = 'none';
            }});

            tl.to("#logo-v", { duration: 2, opacity: 1, y: 0, ease: "expo.out", delay: 1 })
              .to("#main-title", { duration: 1.8, opacity: 1, y: 0, ease: "power4.out" }, "-=1.5")
              .to("#main-tagline", { duration: 1.5, opacity: 1, y: 0, ease: "power4.out" }, "-=1.3")
              .to(".btn-market", { duration: 1.2, opacity: 1, y: 0, stagger: 0.2, ease: "power3.out" }, "-=0.8")
              .to(".trust-info", { duration: 1, opacity: 1, y: 0, ease: "power3.out" }, "-=0.4");
            
            animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
